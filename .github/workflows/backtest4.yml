name: Backtest 4 (10 years)

on:
  workflow_dispatch:   # запускается вручную кнопкой

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python backtest4.py
